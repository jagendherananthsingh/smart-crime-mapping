version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: crime_mapping_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - crime_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crime_mapping_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/smart_crime_mapping
      - JWT_SECRET=smart_crime_mapping_super_secure_jwt_secret_key_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - crime_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crime_mapping_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - crime_network

volumes:
  mongodb_data:
    driver: local

networks:
  crime_network:
    driver: bridge
